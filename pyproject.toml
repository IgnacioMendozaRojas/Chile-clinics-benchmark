[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chile-clinics-benchmark"
version = "0.1.0"
description = "Self-updating benchmark of Chilean private clinic operators, rebuilt from public CMF filings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
dependencies = [
  # CMF XBRL connector (CmfFilings + parser), pinned to an exact commit for reproducibility
  "equity-research-engine @ git+https://github.com/IgnacioMendozaRojas/equity-research-engine@8f1f55e7786a1a2226e7845ac964d39e1a8c5893",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/IgnacioMendozaRojas/chile-clinics-benchmark"
Data = "https://github.com/IgnacioMendozaRojas/chile-clinics-benchmark/tree/main/data/processed"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/clinics"]

[tool.hatch.build.targets.wheel.force-include]
"config/issuers.yaml" = "clinics/_config/issuers.yaml"
"config/concepts.yaml" = "clinics/_config/concepts.yaml"
"config/notes.yaml" = "clinics/_config/notes.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
