# Issuers in the benchmark. Only entities that file IFRS statements with the CMF.
#
# rut / dv      RUT without and with check digit (the CMF site uses the bare number)
# type          provider   = clinic operator, receivables from Isapres stay on its balance sheet
#               integrated = owns an Isapre and clinics; intra-group receivables are eliminated
#                            on consolidation, so payer-exposure metrics are not comparable
# cmf_status    VI (vigente) or NV (no vigente) in the CMF securities registry; selects the
#               entity page used to list filings
# panel         core = post-crisis comparison set; historical = series ends with deregistration
# last_filing   for issuers that stopped filing: quarters after it are not requested
# credit_losses face = use the IFRS 9 credit-loss line of the income statement where filed;
#               default (allowance) = proxy from the allowance roll-forward (see indicators)
# notes         context that the README and the coverage matrix must surface

issuers:
  clc:
    name: Clínica Las Condes S.A.
    short: CLC
    rut: 93930000
    dv: "7"
    type: provider
    cmf_status: VI
    panel: core
    notes: >
      FY2025 statements filed late (trading suspended Apr-2026); its December 2025 filing restated
      December 2024. Figures stay as reported; the restatement is logged in restatements.csv.
      Change of control to Euroamerica in 2026.

  indisa:
    name: Instituto de Diagnóstico S.A.
    short: Indisa
    rut: 92051000
    dv: "0"
    type: provider
    cmf_status: VI
    panel: core
    credit_losses: face  # IFRS 9 line filed from 2019Q4; earlier quarters use the allowance proxy

  redsalud:
    name: Empresas Red Salud S.A.
    short: RedSalud
    rut: 76020458
    dv: "7"
    type: provider
    cmf_status: VI
    panel: core

  banmedica:
    name: Banmédica S.A.
    short: Banmédica
    rut: 96528990
    dv: "9"
    type: integrated
    cmf_status: NV
    panel: historical
    last_filing: 2024Q2
    notes: Shares delisted in 2020; all bonds redeemed on 5-Sep-2024. XBRL available 2016Q1-2024Q2 (probe, Oct-2026).

  bupa:
    name: Bupa Chile S.A.
    short: Bupa Chile
    rut: 76005001
    dv: "6"
    type: integrated
    cmf_status: NV
    panel: historical
    last_filing: 2022Q1
    notes: Listed as "No Vigente" in the CMF registry. XBRL available 2016Q1-2022Q1 (probe, Oct-2026).
